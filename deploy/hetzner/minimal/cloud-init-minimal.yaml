#cloud-config
# First-boot bootstrap for Capuz *minimal* Hetzner VPS (live static site only).
# Editor runs on your laptop via docker-compose.stack.yml + SFTP.
# Further setup: deploy/hetzner/minimal/deploy-minimal.sh

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - ufw

runcmd:
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - mkdir -p /opt/capuz
