# Local override for the reference stack (HTTP on :8080).
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build -d
# With SFTP: add -f docker-compose.local.sftp.yml
services:
  cms-api:
    environment:
      SITE_BASE_URL: http://localhost:8080
      PREVIEW_BASE_URL: http://preview.localhost:8080

  openwebui:
    environment:
      WEBUI_URL: http://chat.localhost:8080

  edge-router:
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
