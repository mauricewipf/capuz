# Optional override: mount an SSH private key for STORAGE_BACKEND=sftp.
# Use with the local editor stack when publishing to a remote nginx root
# (e.g. Hetzner minimal deploy over Tailscale).
#
#   cp deploy/hetzner/minimal/env.local.example .env
#   docker compose -f docker-compose.stack.yml -f docker-compose.stack.sftp.yml up --build
#
# Requires SFTP_KEY_HOST_PATH in .env (absolute path to an existing private key file).

services:
  stack:
    volumes:
      - ${SFTP_KEY_HOST_PATH:?Set SFTP_KEY_HOST_PATH in .env to your SSH private key file}:${SFTP_KEY_PATH:-/keys/id_ed25519}:ro
