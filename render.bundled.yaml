# Capuz monolith Blueprint (site + chat + preview on one port).
# Requires custom domains on Render — nested *.onrender.com subdomains do not resolve.
# Set SITE_HOST, EDITOR_HOST, PREVIEW_HOST (and matching WEBUI_URL / PREVIEW_BASE_URL / SITE_BASE_URL).
# CAPUZ_SERVE_SITE=true (default): full site + chat + preview (STORAGE_BACKEND=fs).
# CAPUZ_SERVE_SITE=false: chat + preview only; live site elsewhere (STORAGE_BACKEND=sftp|git|s3).
services:
  - type: web
    name: capuz
    runtime: docker
    dockerfilePath: ./Dockerfile.bundled
    numInstances: 1
    region: frankfurt
    plan: starter
    healthCheckPath: /
    autoDeployTrigger: commit
    branch: main
    envVars:
      - key: APP_NAME
        value: Capuz CMS
      - key: CAPUZ_SERVE_SITE
        value: "true"
      - key: OPENAI_API_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ENABLE_OPENAI_API
        value: "true"
      - key: DEFAULT_MODELS
        value: minimax/minimax-m3
      - key: DEFAULT_MODEL_PARAMS
        value: '{"function_calling":"native"}'
      - key: CMS_API_KEY
        generateValue: true
      - key: WEBUI_SECRET_KEY
        generateValue: true
      - key: SITE_HOST
        value: example.com
      - key: EDITOR_HOST
        value: chat.example.com
      - key: PREVIEW_HOST
        value: preview.example.com
      - key: SITE_BASE_URL
        value: https://example.com
      - key: WEBUI_URL
        value: https://chat.example.com
      - key: PREVIEW_BASE_URL
        value: https://preview.example.com
      - key: ENABLE_SIGNUP
        value: "true"
      - key: DATA_DIR
        value: /app/data/.open-webui
      - key: DATA_ROOT
        value: /app/data
      - key: STORAGE_BACKEND
        value: fs
      - key: DRAFTS_DIR
        value: .drafts
      - key: COMPONENTS_DIR
        value: .components
      - key: NGINX_PORT
        value: "8088"
      - key: RAG_EMBEDDING_ENGINE
        value: openai
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
